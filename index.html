<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PromptVault - AI Prompt Library</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
    background: #0d1117; color: #c9d1d9; min-height: 100vh;
}
header {
    background: #161b22; border-bottom: 1px solid #30363d;
    padding: 20px 32px; text-align: center; position: relative;
}
header h1 { font-size: 26px; font-weight: 600; color: #58a6ff; margin-bottom: 4px; }
header p { color: #8b949e; font-size: 13px; }
.lang-switch {
    position: absolute; top: 50%; right: 24px; transform: translateY(-50%);
    display: flex; gap: 4px; background: #21262d; border-radius: 6px; padding: 3px;
    border: 1px solid #30363d;
}
.lang-switch button {
    background: none; border: none; color: #8b949e; cursor: pointer;
    font-size: 12px; padding: 4px 12px; border-radius: 4px;
    transition: all 0.2s; font-family: inherit;
}
.lang-switch button.active { background: #1f6feb; color: #fff; }

.search-wrap {
    max-width: 720px; margin: 24px auto; padding: 0 16px;
}
.search-wrap input, .search-wrap select {
    width: 100%; padding: 12px 16px;
    background: #161b22; border: 1px solid #30363d; border-radius: 8px;
    color: #c9d1d9; font-size: 15px; outline: none; margin-bottom: 12px;
    transition: border-color 0.2s;
}
.search-wrap input:focus, .search-wrap select:focus { border-color: #58a6ff; }
.search-wrap select { cursor: pointer; appearance: none; }

.filters { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 12px; }
.filters select { flex: 1; min-width: 130px; margin-bottom: 0; }

.tag-filter { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 16px; }
.tag-filter .tag {
    padding: 4px 12px; border-radius: 20px; font-size: 12px;
    border: 1px solid #30363d; color: #8b949e; cursor: pointer;
    transition: all 0.2s;
}
.tag-filter .tag:hover { border-color: #58a6ff; color: #58a6ff; }
.tag-filter .tag.active { background: #1f6feb22; border-color: #1f6feb; color: #58a6ff; }

.results { max-width: 960px; margin: 24px auto; padding: 0 16px; }
.results-header { color: #8b949e; font-size: 13px; margin-bottom: 16px; }

.card {
    background: #161b22; border: 1px solid #30363d; border-radius: 10px;
    padding: 20px; margin-bottom: 12px; transition: border-color 0.2s;
}
.card:hover { border-color: #58a6ff; }
.card-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 8px; flex-wrap: wrap; gap: 8px; }
.card-id { color: #8b949e; font-size: 11px; font-family: monospace; }
.card-title { font-size: 16px; font-weight: 600; color: #e6edf3; }
.card-title-cn { font-size: 13px; color: #8b949e; margin-left: 8px; }
.card-desc { font-size: 13px; color: #8b949e; margin-bottom: 10px; line-height: 1.5; }
.card-meta { display: flex; flex-wrap: wrap; gap: 8px; font-size: 11px; color: #6e7681; margin-bottom: 12px; }
.card-meta span {
    padding: 2px 8px; border-radius: 4px; background: #21262d; border: 1px solid #30363d;
}

.card-prompt { display: none; margin-top: 12px; }
.card-prompt.show { display: block; }
.card-prompt pre {
    background: #0d1117; border: 1px solid #30363d; border-radius: 6px;
    padding: 14px; font-size: 12px; line-height: 1.6; overflow-x: auto;
    white-space: pre-wrap; word-break: break-word; color: #c9d1d9;
}
.card-prompt .lang-tab {
    display: inline-block; padding: 4px 10px; border-radius: 4px 4px 0 0;
    font-size: 11px; cursor: pointer; border: 1px solid #30363d; border-bottom: none;
    background: #0d1117; color: #8b949e; margin-right: 4px;
}
.card-prompt .lang-tab.active { background: #161b22; color: #58a6ff; border-color: #58a6ff #30363d #161b22; }

.expand-btn {
    background: none; border: 1px solid #30363d; color: #58a6ff;
    padding: 5px 14px; border-radius: 6px; cursor: pointer; font-size: 12px;
    transition: all 0.2s;
}
.expand-btn:hover { background: #1f6feb22; border-color: #58a6ff; }
.copy-btn {
    background: none; border: 1px solid #30363d; color: #8b949e;
    padding: 5px 12px; border-radius: 6px; cursor: pointer; font-size: 12px;
    margin-left: 8px; transition: all 0.2s;
}
.copy-btn:hover { color: #e6edf3; border-color: #58a6ff; }

.stats { max-width: 960px; margin: 0 auto; padding: 0 16px 32px; text-align: center; }
.stats span { color: #58a6ff; font-weight: 600; }

footer {
    text-align: center; padding: 20px; color: #484f58; font-size: 12px;
    border-top: 1px solid #30363d;
}
footer a { color: #58a6ff; text-decoration: none; }

@media (max-width: 600px) {
    header { padding: 16px; }
    .lang-switch { position: static; transform: none; justify-content: center; margin-top: 10px; }
    .filters { flex-direction: column; }
    .card-header { flex-direction: column; }
}
</style>
</head>
<body>

<header>
    <h1>PromptVault</h1>
    <p id="stats-line">Loading...</p>
    <div class="lang-switch">
        <button id="btn-zh" class="active" onclick="setLang('zh')">中文</button>
        <button id="btn-en" onclick="setLang('en')">EN</button>
    </div>
</header>

<div class="search-wrap">
    <input type="text" id="search" oninput="filter()">
    <div class="filters">
        <select id="cat-filter" onchange="filter()">
            <option value="all">--</option>
        </select>
        <select id="diff-filter" onchange="filter()">
            <option value="all">--</option>
        </select>
        <select id="model-filter" onchange="filter()">
            <option value="all">--</option>
        </select>
    </div>
    <div class="tag-filter" id="tag-bar"></div>
</div>

<div class="results">
    <div class="results-header" id="results-count"></div>
    <div id="card-list"></div>
</div>

<footer>
    PromptVault &mdash; <span id="footer-total"></span> &middot;
    <a href="https://github.com/CianLaw/prompt-vault" target="_blank">GitHub</a>
</footer>

<script>
let allPrompts = [];
let allTags = new Set();
let currentLang = 'zh';

const I18N = {
    zh: {
        stats: '条提示词 · 11 个分类 · 中英双语 · JSON 结构化',
        searchPlaceholder: '输入关键词搜索提示词（如：写作、编程、营销、GPT-4）',
        catAll: '全部分类',
        diffAll: '全部难度',
        diffBeginner: '入门',
        diffIntermediate: '进阶',
        diffAdvanced: '高级',
        modelAll: '全部模型',
        showing: '共显示 ',
        of: ' / ',
        showPrompt: '展开提示词',
        hidePrompt: '收起提示词',
        copy: '复制',
        copied: '已复制',
        github: 'GitHub',
    },
    en: {
        stats: 'prompts · 11 categories · Bilingual EN/ZH · JSON structured',
        searchPlaceholder: 'Search by keyword, title, tag... (e.g. writing, marketing)',
        catAll: 'All Categories',
        diffAll: 'All Difficulty',
        diffBeginner: 'Beginner',
        diffIntermediate: 'Intermediate',
        diffAdvanced: 'Advanced',
        modelAll: 'All Models',
        showing: 'Showing ',
        of: ' of ',
        showPrompt: 'Show Prompt',
        hidePrompt: 'Hide Prompt',
        copy: 'Copy',
        copied: 'Copied!',
        github: 'GitHub',
    }
};

const CAT_NAMES = {
    zh: {
        'writing':'写作与内容','coding':'编程与开发','business':'商业与金融',
        'creative':'创意与设计','education':'教育与学习','productivity':'效率与工作流',
        'marketing':'营销与增长','analysis':'分析与研究','roleplay':'角色扮演与模拟',
        'image-gen':'图像生成','video-gen':'视频生成'
    },
    en: {
        'writing':'Writing & Content','coding':'Coding & Development',
        'business':'Business & Finance','creative':'Creative & Design',
        'education':'Education & Learning','productivity':'Productivity & Workflow',
        'marketing':'Marketing & Growth','analysis':'Analysis & Research',
        'roleplay':'Roleplay & Simulation','image-gen':'Image Generation',
        'video-gen':'Video Generation'
    }
};

function t(key) { return I18N[currentLang][key]; }

async function load() {
    const cats = Object.keys(CAT_NAMES.en);
    for (const cat of cats) {
        try {
            const r = await fetch('prompts/' + cat + '/prompts.json');
            const data = await r.json();
            data.forEach(p => { p.category = cat; allTags.add(...p.tags); });
            allPrompts.push(...data);
        } catch(e) { console.warn('Failed to load', cat, e); }
    }
    buildUI();
    filter();
}

function buildUI() {
    setLang('zh');

    const sel = document.getElementById('cat-filter');
    for (const [k,v] of Object.entries(CAT_NAMES.en)) {
        const opt = document.createElement('option');
        opt.value = k; opt.dataset.en = v; opt.dataset.zh = CAT_NAMES.zh[k];
        sel.appendChild(opt);
    }

    const tagBar = document.getElementById('tag-bar');
    [...allTags].sort().forEach(tg => {
        const span = document.createElement('span');
        span.className = 'tag'; span.textContent = tg;
        span.onclick = () => { span.classList.toggle('active'); filter(); };
        tagBar.appendChild(span);
    });

    filter();
}

function setLang(lang) {
    currentLang = lang;
    document.getElementById('btn-zh').classList.toggle('active', lang === 'zh');
    document.getElementById('btn-en').classList.toggle('active', lang === 'en');
    document.documentElement.lang = lang === 'zh' ? 'zh-CN' : 'en';

    const stats = document.getElementById('stats-line');
    stats.textContent = `${allPrompts.length} ${t('stats')}`;
    document.getElementById('footer-total').textContent = `${allPrompts.length}+`;

    document.getElementById('search').placeholder = t('searchPlaceholder');

    const catSel = document.getElementById('cat-filter');
    if (catSel.options.length > 1) {
        catSel.options[0].textContent = t('catAll');
        for (let i = 1; i < catSel.options.length; i++) {
            catSel.options[i].textContent = lang === 'zh' ? catSel.options[i].dataset.zh : catSel.options[i].dataset.en;
        }
    }

    const diffSel = document.getElementById('diff-filter');
    diffSel.options[0].textContent = t('diffAll');
    diffSel.options[1].textContent = t('diffBeginner');
    diffSel.options[2].textContent = t('diffIntermediate');
    diffSel.options[3].textContent = t('diffAdvanced');

    const modelSel = document.getElementById('model-filter');
    modelSel.options[0].textContent = t('modelAll');

    document.getElementById('footer').querySelector('a').textContent = t('github');

    filter();
}

function filter() {
    const q = document.getElementById('search').value.toLowerCase();
    const cat = document.getElementById('cat-filter').value;
    const diff = document.getElementById('diff-filter').value;
    const model = document.getElementById('model-filter').value;
    const activeTags = [...document.querySelectorAll('.tag.active')].map(e => e.textContent);

    let filtered = allPrompts;
    if (cat !== 'all') filtered = filtered.filter(p => p.category === cat);
    if (diff !== 'all') filtered = filtered.filter(p => p.difficulty === diff);
    if (model !== 'all') filtered = filtered.filter(p => p.model_compatibility.includes(model));

    if (q) {
        filtered = filtered.filter(p =>
            p.title.toLowerCase().includes(q) ||
            p.title_cn.includes(q) ||
            p.description.toLowerCase().includes(q) ||
            p.description_cn.includes(q) ||
            p.tags.some(tg => tg.includes(q)) ||
            p.id.includes(q) ||
            p.prompt.toLowerCase().includes(q) ||
            p.prompt_cn.includes(q)
        );
    }

    if (activeTags.length) {
        filtered = filtered.filter(p => activeTags.every(tg => p.tags.includes(tg)));
    }

    document.getElementById('results-count').textContent =
        `${t('showing')}${filtered.length}${t('of')}${allPrompts.length}`;

    const list = document.getElementById('card-list');
    list.innerHTML = filtered.map(p => `
        <div class="card">
            <div class="card-header">
                <div>
                    <span class="card-id">${p.id}</span>
                    <span class="card-title">${p.title}</span>
                    <span class="card-title-cn">${p.title_cn}</span>
                </div>
                <div style="display:flex;align-items:center;gap:8px;">
                    <span style="font-size:11px;color:#6e7681;">${currentLang === 'zh' ? ({beginner:'入门',intermediate:'进阶',advanced:'高级'})[p.difficulty] : p.difficulty}</span>
                    <button class="expand-btn" onclick="togglePrompt(this, '${p.id}')">${t('showPrompt')}</button>
                </div>
            </div>
            <div class="card-desc">${currentLang === 'zh' ? p.description_cn : p.description}</div>
            <div class="card-meta">
                ${p.tags.map(tg=>`<span>${tg}</span>`).join('')}
                ${p.model_compatibility.map(m=>`<span style="background:#1f6feb22;border-color:#1f6feb44;">${m}</span>`).join('')}
            </div>
            <div class="card-prompt" id="prompt-${p.id}">
                <span class="lang-tab active" onclick="switchLang(this,'en','${p.id}')">EN</span>
                <span class="lang-tab" onclick="switchLang(this,'cn','${p.id}')">中文</span>
                <button class="copy-btn" onclick="copyPrompt('${p.id}','en')">${t('copy')} EN</button>
                <button class="copy-btn" onclick="copyPrompt('${p.id}','cn')">${t('copy')} 中文</button>
                <pre id="text-${p.id}">${escapeHtml(currentLang === 'zh' ? p.prompt_cn : p.prompt)}</pre>
            </div>
        </div>
    `).join('');

    document.querySelectorAll('.card-prompt').forEach(el => el.classList.remove('show'));
}

function togglePrompt(btn, id) {
    const el = document.getElementById('prompt-' + id);
    const isOpen = el.classList.contains('show');
    el.classList.toggle('show');
    btn.textContent = isOpen ? t('showPrompt') : t('hidePrompt');
}

function switchLang(tab, lang, id) {
    const parent = tab.parentElement;
    parent.querySelectorAll('.lang-tab').forEach(tg => tg.classList.remove('active'));
    tab.classList.add('active');
    const pre = document.getElementById('text-' + id);
    const prompt = allPrompts.find(p => p.id === id);
    if (prompt) pre.textContent = lang === 'en' ? prompt.prompt : prompt.prompt_cn;
}

function copyPrompt(id, lang) {
    const prompt = allPrompts.find(p => p.id === id);
    const text = lang === 'en' ? prompt.prompt : prompt.prompt_cn;
    navigator.clipboard.writeText(text).then(() => {
        const btn = event.target;
        const orig = btn.textContent;
        btn.textContent = t('copied');
        setTimeout(() => btn.textContent = orig, 1200);
    });
}

function escapeHtml(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

load();
</script>
</body>
</html>
